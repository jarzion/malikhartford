<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#000000">
    <title>404 | Malik Hartford</title>
    <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon.png">
    <link rel="icon" type="image/png" sizes="48x48" href="/images/favicon-48.png">
    <link rel="icon" type="image/png" sizes="96x96" href="/images/favicon-96.png">
    <link rel="icon" type="image/png" sizes="192x192" href="/images/favicon-192.png">
    <style>
      *, *::before, *::after { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #000;
        color: #fff;
        font-family: "Roboto", "Helvetica", "Arial", sans-serif;
        text-align: center;
      }
      main { padding: 2em; max-width: 28rem; }
      .logo {
        width: min(220px, 70vw);
        height: auto;
        margin: 0 auto 1.5rem;
        display: block;
      }
      h1 {
        margin: 0 0 0.25em;
        font-size: 2.25em;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      p {
        margin: 0 0 2em;
        font-size: 0.75em;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      a {
        display: inline-block;
        padding: 10px 1.5rem;
        background: #2B75AC;
        color: #fff;
        font-size: 0.75em;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        text-decoration: none;
        border-radius: 0.5rem;
      }
      a:hover, a:focus-visible { opacity: 0.92; }
      a:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
    </style>
  </head>
  <body>
    <main>
      <img class="logo" src="/images/kingleeklogo.png" width="200" height="110" alt="King Leek">
      <h1>404</h1>
      <p>Looks like you fumbled?</p>
      <a href="/">Head home</a>
    </main>
  </body>
</html>
